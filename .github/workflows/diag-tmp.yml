name: Diag (temporary)

on:
  pull_request:
    branches: [main]

jobs:
  step:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            cmd: npx prettier --write src/lib/avatar.ts src/lib/avatar.test.ts src/components/receipts/item-assignment.tsx "src/app/[locale]/(app)/groups/[groupId]/scan/page.tsx" "src/app/[locale]/(app)/groups/[groupId]/expenses/[expenseId]/page.tsx" && git --no-pager diff --no-color
          - name: lint
            cmd: npm run lint
          - name: tsc
            cmd: npx prisma generate >/dev/null && npx tsc --noEmit
          - name: unit
            cmd: npx prisma generate >/dev/null && npx vitest run 2>&1 | sed -n '/FAIL/,$p' | head -100
    name: diag-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run
        env:
          CMD: ${{ matrix.cmd }}
        run: |
          set +e
          bash -c "$CMD" > out.txt 2>&1
          code=$?
          sed -i 's/\x1b\[[0-9;]*m//g' out.txt
          python3 - <<'PY'
          t = open('out.txt', errors='replace').read()
          for i in range(0, min(len(t), 15000), 3000):
              chunk = t[i:i+3000].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::error title=diag-out-{i//3000}::{chunk}")
          PY
          exit 1
