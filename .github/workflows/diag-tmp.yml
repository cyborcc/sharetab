name: Diag (temporary)

on:
  pull_request:
    branches: [main]

jobs:
  step:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            cmd: npx prettier --write "src/app/[[]locale]/(app)/groups/[[]groupId]/expenses/[[]expenseId]/page.tsx" src/lib src/server/lib/user-language.ts src/server/ai src/server/trpc/routers/groups.ts src/server/trpc/routers/receipts.ts src/server/lib/receipt-correction.ts src/server/lib/receipt-processor.ts src/components/receipts/item-assignment.tsx && git --no-pager diff --no-color
          - name: format-check
            cmd: npm run format:check
          - name: lint
            cmd: npm run lint
          - name: unit
            cmd: npx prisma generate >/dev/null && npx vitest run --reporter=default 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | sed -n '/FAIL\|Error\|expected/,$p' | head -120
    name: diag-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run
        env:
          CMD: ${{ matrix.cmd }}
        run: |
          set +e
          bash -c "$CMD" > out.txt 2>&1
          code=$?
          sed -i 's/\x1b\[[0-9;]*m//g' out.txt
          if [ "${{ matrix.name }}" = "format" ] || [ "${{ matrix.name }}" = "unit" ]; then
            # these two print the information we need: emit it in chunks as annotations
            python3 - <<'PY'
          import re
          t = open('out.txt', errors='replace').read()
          for i in range(0, min(len(t), 18000), 3000):
              chunk = t[i:i+3000].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::error title=diag-out-{i//3000}::{chunk}")
          PY
          else
            body=$(grep -v '^\s*$' out.txt | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ $code -ne 0 ] && echo "::error title=diag-failed::${body:0:3500}"
          fi
          # format job: only reports; unit/lint/format-check keep their own exit code
          if [ "${{ matrix.name }}" = "format" ]; then exit 1; fi
          exit $code
